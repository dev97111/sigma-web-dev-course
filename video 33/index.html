<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Animated Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .navbar {
            display: flex;
            background: #ff0000;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        .navbar a {
            text-decoration: none;
            color: white;
            padding: 15px 20px;
            margin: 0 10px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 3px;
            background: rgb(35, 152, 22);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: yellow;
            text-shadow: 0 0 5px yellow;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Villains</a>
        <a href="#">Comics</a>
        <a href="#">Contact</a>
    </nav>
</body>
</html>
